name: rviz2
title: RViz 2
base: core24
adopt-info: rviz2
summary: 3D visualization tool for ROS 2
description: |
  RViz is a 3D visualizer for the Robot Operating System 2 (ROS 2).

  This is a classic snap: rviz2 runs with full access to the host system so it
  load visualization plugins and message definitions installed on the host under /opt/ros/jazzy or
  in a local workspace.
license: BSD-3-Clause

confinement: classic
grade: stable

platforms:
  amd64:
  arm64:

package-repositories:
  - type: apt
    url: http://packages.ros.org/ros2/ubuntu
    components: [main]
    formats: [deb]
    suites: [noble]
    key-id: C1CF6E31E6BADE8868B172B4F42ED6FBAB17C654
    key-server: keyserver.ubuntu.com

apps:
  rviz2:
    command: opt/ros/snap/bin/rviz2
    command-chain: [snap/command-chain/ros2-launch]

parts:
  ros2-launch:
    plugin: nil
    source: snap/local
    override-build: |
      craftctl default
      install -D -m 0755 launch \
        "$CRAFT_PART_INSTALL/snap/command-chain/ros2-launch"

  rviz2:
    plugin: colcon
    source: https://github.com/ros2/rviz.git
    source-tag: "14.1.24" # jazzy
    override-pull: |
      craftctl default
      version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' rviz2/package.xml)"
      craftctl set version="$version"
    colcon-packages-ignore:
      - rviz_rendering_tests
      - rviz_visual_testing_framework
    colcon-cmake-args:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    build-environment:
      - ROS_VERSION: "2"
      - ROS_DISTRO: jazzy
    build-attributes:
      - enable-patchelf
    stage-packages:
      # Qt's xcb platform plugin dlopen()s libxcb-cursor at runtime,
      # but no package declares it as a dependency.
      - libxcb-cursor0

  gpu-2404:
    after: [rviz2]
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
